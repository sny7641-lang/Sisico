name: Build Android APK

on:
  push:
    branches: ["**"]
    paths: ["www/**", "assets/**", "package.json", "package-lock.json", "capacitor.config.json", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest runners ship with the Android SDK (ANDROID_HOME)
      - name: Install dependencies
        run: npm ci

      - name: Create Android project
        run: |
          npx cap add android
          npm run android:icons
          npx cap sync android

      # Sign every build with the same key (assets/debug.keystore) so a new APK installs
      # over the old one and keeps your words.
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/assets/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/debug/app-debug.apk ../sisico-vocab.apk

      - name: Check APK signing key
        run: |
          want=$(keytool -list -v -keystore assets/debug.keystore -storepass android | grep -m1 "SHA256:" | awk '{print $2}')
          got=$(keytool -printcert -jarfile sisico-vocab.apk | grep -m1 "SHA256:" | awk '{print $2}')
          echo "want $want"; echo "got  $got"
          test "$want" = "$got"

      - uses: actions/upload-artifact@v4
        with:
          name: sisico-vocab-apk
          path: sisico-vocab.apk

      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Sisico 단어장 (최신 빌드)
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            휴대폰에서 아래 **sisico-vocab.apk** 를 눌러 내려받아 설치하세요.
            빌드 커밋: ${{ github.sha }}
          files: sisico-vocab.apk
