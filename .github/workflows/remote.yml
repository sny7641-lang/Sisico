name: Build Sisico Remote

on:
  push:
    branches: ["**"]
    paths: ["remote/**", ".github/workflows/remote.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest runners ship with the Android SDK (ANDROID_HOME)
      - name: Build and test APK
        working-directory: remote/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon -PbuildNumber=${{ github.run_number }} \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/assets/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/sisico-remote.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: sisico-remote-apk
          path: sisico-remote.apk

  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sisico_remote_host.exe and sisico_remote_viewer.exe
        working-directory: remote/host
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          $kst = [System.TimeZoneInfo]::ConvertTimeBySystemTimeZoneId((Get-Date), "Korea Standard Time").ToString("yyyy-MM-dd HH:mm")
          "BUILD = ${{ github.run_number }}`nBUILD_TIME = `"$kst`"`n" | Out-File -Encoding utf8 build_info.py
          pyinstaller --onefile --windowed --name sisico_remote_host --collect-all av --hidden-import pystray._win32 sisico_remote_host.py
          pyinstaller --onefile --windowed --name sisico_remote_viewer --collect-all av sisico_remote_viewer.py
          Copy-Item dist/sisico_remote_host.exe $env:GITHUB_WORKSPACE/sisico_remote_host.exe
          Copy-Item dist/sisico_remote_viewer.exe $env:GITHUB_WORKSPACE/sisico_remote_viewer.exe
      - name: Check the packaged exe (tray icon, PIL, tkinter, encoder)
        shell: pwsh
        run: |
          $d = Start-Process -FilePath "$env:GITHUB_WORKSPACE/sisico_remote_host.exe" -ArgumentList "--diag","$env:RUNNER_TEMP\diag.txt" -PassThru
          if (-not $d.WaitForExit(120000)) { Write-Host "diag did not finish"; exit 1 }
          Get-Content "$env:RUNNER_TEMP\diag.txt"
          exit $d.ExitCode
      - name: Smoke test (TLS, H.264 stream, files, PC viewer)
        working-directory: remote/host
        shell: pwsh
        timeout-minutes: 6
        run: |
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE/sisico_remote_host.exe" -ArgumentList "--test","--no-tray","--password","ci-test-pass" -PassThru
          Start-Sleep -Seconds 8
          python smoke_test.py ci-test-pass
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            Write-Host "--- viewer selftest (source)"
            python sisico_remote_viewer.py --selftest 127.0.0.1 ci-test-pass
            $code = $LASTEXITCODE
            Get-Content selftest.log
          }
          if ($code -eq 0) {
            Write-Host "--- viewer selftest (exe)"
            $v = Start-Process -FilePath "$env:GITHUB_WORKSPACE/sisico_remote_viewer.exe" -ArgumentList "--selftest","127.0.0.1","ci-test-pass" -PassThru
            if (-not $v.WaitForExit(90000)) { Write-Host "viewer exe did not exit"; $v.Kill($true); $code = 1 } else { $code = $v.ExitCode }
            Get-Content selftest.log
            Write-Host "viewer exe exit code: $code"
          }
          Stop-Process -Id $p.Id -Force
          exit $code
      - name: Service mode test (lock screen / before login)
        working-directory: remote/host
        shell: pwsh
        timeout-minutes: 8
        run: |
          # 앞 단계에서 만든 사용자 설정(비밀번호·인증서)을 서비스 모드로 옮겨 설치(실제 화면 캡처) →
          # 이 PC를 실제로 잠금 → SYSTEM 호스트가 잠금 화면을 보내는지 확인 → 제거
          $exe = "$env:GITHUB_WORKSPACE/sisico_remote_host.exe"
          Stop-Process -Name sisico_remote_host -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 2
          $i = Start-Process -FilePath $exe -ArgumentList "--install-service","$env:APPDATA\SisicoRemote","--result","$env:RUNNER_TEMP\install.txt" -PassThru
          if (-not $i.WaitForExit(120000)) { Write-Host "install did not finish"; exit 1 }
          Write-Host "install exit code: $($i.ExitCode), result: $(Get-Content $env:RUNNER_TEMP\install.txt)"
          # 업데이트(이미 설치된 상태에서 다시 설치)도 되는지: 실행 중인 SYSTEM 호스트를 끄고 파일을 바꿀 수 있어야 함
          Start-Sleep -Seconds 6
          $i2 = Start-Process -FilePath $exe -ArgumentList "--install-service","$env:APPDATA\SisicoRemote","--result","$env:RUNNER_TEMP\update.txt" -PassThru
          if (-not $i2.WaitForExit(180000)) { Write-Host "update did not finish"; exit 1 }
          Write-Host "update exit code: $($i2.ExitCode), result: $(Get-Content $env:RUNNER_TEMP\update.txt)"
          if ($i2.ExitCode -ne 0) { exit 1 }
          schtasks /Query /TN SisicoRemoteHost /V /FO LIST | Select-String "Status|Run As User|Task To Run"
          Start-Sleep -Seconds 10
          Write-Host "--- unlocked desktop"
          python smoke_test.py ci-test-pass --real
          $code = $LASTEXITCODE
          Write-Host "--- locking the workstation"
          rundll32.exe user32.dll,LockWorkStation
          Start-Sleep -Seconds 8
          python smoke_test.py ci-test-pass --real
          if ($LASTEXITCODE -ne 0) { $code = 1 }
          $slog = Get-Content "$env:ProgramData\SisicoRemote\service.log" -Raw -ErrorAction SilentlyContinue
          Write-Host $slog
          if ($slog -notmatch "capture follows desktop: Winlogon") { Write-Host "host never captured the Winlogon (lock) desktop"; $code = 1 }
          $procs = Get-CimInstance Win32_Process -Filter "Name='sisico_remote_host.exe'"
          $procs | Select-Object ProcessId, SessionId, CommandLine | Format-Table -AutoSize | Out-String -Width 300
          $child = $procs | Where-Object { $_.CommandLine -like "*--system-child*" -and $_.SessionId -ne 0 }
          if (-not $child) { Write-Host "no --system-child host running in a desktop session"; $code = 1 }
          $u = Start-Process -FilePath $exe -ArgumentList "--uninstall-service" -PassThru
          $u.WaitForExit(60000) | Out-Null
          schtasks /Query /TN SisicoRemoteHost 2>$null
          if ($LASTEXITCODE -eq 0) { Write-Host "task still exists after uninstall"; $code = 1 }
          if ($i.ExitCode -ne 0) { $code = 1 }
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: sisico-remote-host
          path: |
            sisico_remote_host.exe
            sisico_remote_viewer.exe

  publish:
    needs: [android, windows-host]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Build time (Korea)
        id: when
        run: echo "kst=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')" >> "$GITHUB_OUTPUT"
      - name: Publish to the "remote-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: remote-latest
          name: Sisico 원격 v${{ github.run_number }} (최신)
          prerelease: false
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            휴대폰이나 다른 PC로 윈도우 PC를 조작하는 개인용 원격 프로그램 (암호화 연결).
            - 조작당할 PC: **sisico_remote_host.exe** 실행 (처음 실행할 때 접속 비밀번호를 정함, 이후 작업 표시줄 아이콘으로 실행)
            - 휴대폰에서 조작: **sisico-remote.apk** 설치
            - 다른 PC에서 조작: **sisico_remote_viewer.exe** 실행
            자세한 사용법: remote/README.md
            **버전 v${{ github.run_number }}** · 빌드 시각 ${{ steps.when.outputs.kst }} (한국 시간)
            휴대폰 앱 첫 화면 제목 옆과 PC 트레이 '연결 정보 보기'에 같은 번호가 나옵니다.
            빌드 커밋: ${{ github.sha }}
          files: |
            sisico-remote.apk
            sisico_remote_host.exe
            sisico_remote_viewer.exe
