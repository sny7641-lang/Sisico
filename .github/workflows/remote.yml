name: Build Sisico Remote

on:
  push:
    branches: ["**"]
    paths: ["remote/**", ".github/workflows/remote.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      # ubuntu-latest runners ship with the Android SDK (ANDROID_HOME)
      - name: Build and test APK
        working-directory: remote/android
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug --no-daemon \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/assets/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/sisico-remote.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: sisico-remote-apk
          path: sisico-remote.apk

  windows-host:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sisico_remote_host.exe and sisico_remote_viewer.exe
        working-directory: remote/host
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          pyinstaller --onefile --windowed --name sisico_remote_host --collect-all av --hidden-import pystray._win32 sisico_remote_host.py
          pyinstaller --onefile --windowed --name sisico_remote_viewer --collect-all av sisico_remote_viewer.py
          Copy-Item dist/sisico_remote_host.exe $env:GITHUB_WORKSPACE/sisico_remote_host.exe
          Copy-Item dist/sisico_remote_viewer.exe $env:GITHUB_WORKSPACE/sisico_remote_viewer.exe
      - name: Smoke test (TLS, H.264 stream, files, PC viewer)
        working-directory: remote/host
        shell: pwsh
        timeout-minutes: 6
        run: |
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE/sisico_remote_host.exe" -ArgumentList "--test","--no-tray","--password","ci-test-pass" -PassThru
          Start-Sleep -Seconds 8
          python smoke_test.py ci-test-pass
          $code = $LASTEXITCODE
          if ($code -eq 0) {
            Write-Host "--- viewer selftest (source)"
            python sisico_remote_viewer.py --selftest 127.0.0.1 ci-test-pass
            $code = $LASTEXITCODE
            Get-Content selftest.log
          }
          if ($code -eq 0) {
            Write-Host "--- viewer selftest (exe)"
            $v = Start-Process -FilePath "$env:GITHUB_WORKSPACE/sisico_remote_viewer.exe" -ArgumentList "--selftest","127.0.0.1","ci-test-pass" -PassThru
            if (-not $v.WaitForExit(90000)) { Write-Host "viewer exe did not exit"; $v.Kill($true); $code = 1 } else { $code = $v.ExitCode }
            Get-Content selftest.log
            Write-Host "viewer exe exit code: $code"
          }
          Stop-Process -Id $p.Id -Force
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: sisico-remote-host
          path: |
            sisico_remote_host.exe
            sisico_remote_viewer.exe

  publish:
    needs: [android, windows-host]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish to the "remote-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: remote-latest
          name: Sisico 원격 (최신 빌드)
          prerelease: false
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            휴대폰이나 다른 PC로 윈도우 PC를 조작하는 개인용 원격 프로그램 (암호화 연결).
            - 조작당할 PC: **sisico_remote_host.exe** 실행 (처음 실행할 때 접속 비밀번호를 정함, 이후 작업 표시줄 아이콘으로 실행)
            - 휴대폰에서 조작: **sisico-remote.apk** 설치
            - 다른 PC에서 조작: **sisico_remote_viewer.exe** 실행
            자세한 사용법: remote/README.md
            빌드 커밋: ${{ github.sha }}
          files: |
            sisico-remote.apk
            sisico_remote_host.exe
            sisico_remote_viewer.exe
