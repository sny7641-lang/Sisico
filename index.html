<title>Sisico 단어장</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one narrow column like a stack of index cards; the card itself is the hero, tabs sit under the header. */
:root {
  --bg: #e9efee;
  --paper: #fbfdfc;
  --ink: #13242b;
  --muted: #5b6d72;
  --line: #cfdcda;
  --rule: #d9e6f2;
  --accent: #0f6b66;
  --accent-ink: #ffffff;
  --marker: #f5cf3d;
  --good: #1f7a45;
  --bad: #b23a2e;
  --shadow: 0 1px 0 rgba(19,36,43,.06), 0 8px 24px -12px rgba(19,36,43,.25);
  --f-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0d171a; --paper: #152327; --ink: #e3ecea; --muted: #93a6a9;
    --line: #26393d; --rule: #1f3340; --accent: #4cc2b8; --accent-ink: #062321;
    --marker: #e9c23a; --good: #5cc98a; --bad: #f07a6c;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0d171a; --paper: #152327; --ink: #e3ecea; --muted: #93a6a9;
  --line: #26393d; --rule: #1f3340; --accent: #4cc2b8; --accent-ink: #062321;
  --marker: #e9c23a; --good: #5cc98a; --bad: #f07a6c;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 10px 28px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--f-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--f-display); font-weight: 700; font-size: 28px; letter-spacing: -.01em; line-height: 1.1; }
.brand h1 span { background: linear-gradient(transparent 58%, var(--marker) 58%, var(--marker) 90%, transparent 90%); padding: 0 2px; }
.brand p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.stats { display: flex; gap: 14px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { display: block; font-size: 18px; color: var(--ink); font-weight: 500; }

nav.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
nav.tabs button {
  background: none; border: 0; padding: 10px 14px; font-weight: 500; color: var(--muted);
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
nav.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }

.btn {
  border: 1px solid var(--line); background: var(--paper); border-radius: 10px;
  padding: 10px 16px; font-weight: 500; transition: transform .08s ease, background .15s;
}
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.good { border-color: var(--good); color: var(--good); }
.btn.bad { border-color: var(--bad); color: var(--bad); }
.btn.small { padding: 6px 10px; font-size: 13px; border-radius: 8px; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.row.spread { justify-content: space-between; }
.muted { color: var(--muted); }
.mono { font-family: var(--f-mono); font-size: 12px; letter-spacing: .04em; }

/* Index card */
.card-stage { perspective: 1200px; }
.card {
  position: relative; width: 100%; min-height: 280px; border: 0; padding: 0; background: none;
  transform-style: preserve-3d; transition: transform .45s cubic-bezier(.2,.7,.2,1); text-align: left;
}
.card.flipped { transform: rotateY(180deg); }
.face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--paper); border-radius: 6px; box-shadow: var(--shadow);
  padding: 22px 22px 18px; display: flex; flex-direction: column; gap: 10px;
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px);
  background-position: 0 56px; overflow: hidden;
}
.face::before { content: ""; position: absolute; top: 52px; left: 0; right: 0; height: 2px; background: var(--bad); opacity: .45; }
.face.back { transform: rotateY(180deg); }
.face .top { display: flex; justify-content: space-between; color: var(--muted); }
.word { font-family: var(--f-display); font-weight: 700; font-size: clamp(36px, 9vw, 56px); line-height: 1.05; letter-spacing: -.02em; margin: auto 0 0; overflow-wrap: anywhere; }
.pos { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.meaning { font-size: 24px; font-weight: 700; margin-top: 6px; overflow-wrap: anywhere; }
.example { font-family: var(--f-display); font-size: 17px; line-height: 1.5; margin: 0; }
.example mark { background: var(--marker); color: #13242b; padding: 0 2px; border-radius: 2px; }
.hint { margin-top: auto; color: var(--muted); font-size: 13px; }
.boxes { display: flex; gap: 4px; }
.boxes i { width: 14px; height: 6px; border-radius: 2px; background: var(--line); }
.boxes i.on { background: var(--accent); }

.empty { background: var(--paper); border: 1px dashed var(--line); border-radius: 10px; padding: 28px 20px; text-align: center; }
.empty h2 { margin: 0 0 6px; font-family: var(--f-display); font-size: 22px; }

/* Quiz */
.quiz-q { background: var(--paper); border-radius: 6px; box-shadow: var(--shadow); padding: 22px; display: flex; flex-direction: column; gap: 6px; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 460px) { .choices { grid-template-columns: 1fr; } }
.choice { text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 10px; padding: 14px; min-width: 0; overflow-wrap: anywhere; }
.choice.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--paper)); }
.choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 12%, var(--paper)); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: var(--paper); border: 0; padding: 8px 12px; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.type-in { display: flex; gap: 8px; }
.type-in input { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); font-family: var(--f-display); font-size: 20px; }
.feedback { min-height: 1.6em; font-weight: 500; }
.feedback.ok { color: var(--good); }
.feedback.no { color: var(--bad); }
.progress { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.progress div { height: 100%; background: var(--accent); transition: width .3s; }

/* List */
form.add { background: var(--paper); border-radius: 10px; border: 1px solid var(--line); padding: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
form.add .full { grid-column: 1 / -1; }
@media (max-width: 460px) { form.add { grid-template-columns: 1fr; } }
label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); min-width: 0; }
label input, label textarea, label select { padding: 9px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-size: 15px; }
textarea { resize: vertical; }
.search { width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); }
ul.words { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
ul.words li { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 12px 2px; border-bottom: 1px solid var(--line); align-items: center; }
ul.words .w { font-family: var(--f-display); font-weight: 700; font-size: 18px; min-width: 0; overflow-wrap: anywhere; }
ul.words .m { color: var(--muted); font-size: 14px; min-width: 0; overflow-wrap: anywhere; }
ul.words .act { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 6px; align-items: center; }
.icon-btn { border: 0; background: none; padding: 6px 8px; border-radius: 8px; color: var(--muted); font-size: 13px; }
.icon-btn:hover { background: var(--line); color: var(--ink); }
details { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
details summary { cursor: pointer; font-weight: 500; }
details[open] summary { margin-bottom: 10px; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .card, .progress div, .toast { transition: none; } }
</style>

<div class="wrap">
  <header>
    <div class="brand">
      <h1><span>Sisico</span> 단어장</h1>
      <p>카드로 외우고, 퀴즈로 확인하는 영어 단어 공부</p>
    </div>
    <div class="stats" aria-label="학습 현황">
      <div><b id="st-total">0</b>전체</div>
      <div><b id="st-due">0</b>오늘 복습</div>
      <div><b id="st-master">0</b>암기 완료</div>
      <div><b id="st-streak">0</b>연속일</div>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button role="tab" id="tab-cards" data-view="cards" aria-selected="true">플래시카드</button>
    <button role="tab" id="tab-quiz" data-view="quiz" aria-selected="false">퀴즈</button>
    <button role="tab" id="tab-list" data-view="list" aria-selected="false">단어 목록</button>
  </nav>

  <!-- Flashcards -->
  <section id="view-cards">
    <div id="cards-body"></div>
  </section>

  <!-- Quiz -->
  <section id="view-quiz" hidden>
    <div class="row spread" style="margin-bottom:14px">
      <div class="seg" role="group" aria-label="퀴즈 종류">
        <button id="qm-choice" data-mode="choice" aria-pressed="true">뜻 고르기</button>
        <button id="qm-type" data-mode="type" aria-pressed="false">철자 쓰기</button>
      </div>
      <span class="mono muted" id="quiz-score">0 / 0</span>
    </div>
    <div id="quiz-body"></div>
  </section>

  <!-- List -->
  <section id="view-list" hidden>
    <div style="display:flex;flex-direction:column;gap:14px">
      <form class="add" id="add-form">
        <label>영어 단어<input id="f-word" required autocomplete="off" placeholder="resilient"></label>
        <label>뜻<input id="f-meaning" required autocomplete="off" placeholder="회복력 있는"></label>
        <label>품사<select id="f-pos">
          <option value="">선택 안 함</option><option>n.</option><option>v.</option><option>adj.</option><option>adv.</option><option>prep.</option><option>phr.</option>
        </select></label>
        <label>예문 (선택)<input id="f-example" autocomplete="off" placeholder="She is resilient under pressure."></label>
        <div class="full row"><button class="btn primary" type="submit">단어 추가</button></div>
      </form>

      <details>
        <summary>여러 단어 한 번에 붙여넣기</summary>
        <label>한 줄에 하나씩, <span class="mono">단어, 뜻</span> 또는 <span class="mono">단어 - 뜻</span> 형식
          <textarea id="f-bulk" rows="5" placeholder="abandon, 버리다&#10;candid - 솔직한"></textarea>
        </label>
        <div class="row" style="margin-top:10px"><button class="btn" id="bulk-add" type="button">모두 추가</button></div>
      </details>

      <input class="search" id="search" type="search" placeholder="단어나 뜻으로 검색" aria-label="검색">
      <ul class="words" id="word-list"></ul>

      <details>
        <summary>데이터 관리</summary>
        <div class="row">
          <button class="btn small" type="button" id="reset-progress">학습 기록 초기화</button>
          <button class="btn small" type="button" id="restore-sample">예시 단어 다시 넣기</button>
          <button class="btn small bad" type="button" id="clear-all">모든 단어 삭제</button>
        </div>
        <p class="muted" id="confirm-msg" style="margin:10px 0 0;font-size:13px">단어와 학습 기록은 이 브라우저에만 저장됩니다.</p>
      </details>
    </div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  "use strict";
  var KEY = "sisico-vocab-v1";
  // Leitner box intervals in days: box 0 = new, box 5 = mastered
  var INTERVALS = [0, 1, 2, 4, 7, 15];
  var DAY = 86400000;

  var SAMPLE = [
    ["abandon", "v.", "버리다, 포기하다", "They had to abandon the car in the snow."],
    ["accurate", "adj.", "정확한", "The report gives an accurate picture of the market."],
    ["benefit", "n.", "이익, 혜택", "Regular exercise has many health benefits."],
    ["candid", "adj.", "솔직한", "Thank you for your candid feedback."],
    ["consistent", "adj.", "일관된, 꾸준한", "Consistent practice is the key to learning."],
    ["curious", "adj.", "호기심 많은", "Children are naturally curious about the world."],
    ["decline", "v.", "감소하다, 거절하다", "She declined the invitation politely."],
    ["efficient", "adj.", "효율적인", "This new engine is far more efficient."],
    ["eager", "adj.", "열망하는", "He was eager to start his new job."],
    ["fragile", "adj.", "깨지기 쉬운", "Handle the box carefully; it is fragile."],
    ["genuine", "adj.", "진짜의, 진심 어린", "Her smile was warm and genuine."],
    ["hesitate", "v.", "망설이다", "Don't hesitate to ask if you need help."],
    ["improve", "v.", "향상시키다", "Reading every day will improve your vocabulary."],
    ["inevitable", "adj.", "피할 수 없는", "Change is inevitable in any company."],
    ["maintain", "v.", "유지하다", "It is hard to maintain focus for hours."],
    ["obvious", "adj.", "명백한", "The answer seemed obvious after the explanation."],
    ["persuade", "v.", "설득하다", "I tried to persuade him to come with us."],
    ["reluctant", "adj.", "꺼리는, 마지못한", "She was reluctant to speak in public."],
    ["resilient", "adj.", "회복력 있는", "Kids are often more resilient than adults."],
    ["sufficient", "adj.", "충분한", "We have sufficient time to finish the project."],
    ["thorough", "adj.", "철저한", "The doctor gave him a thorough examination."],
    ["vivid", "adj.", "생생한", "I have a vivid memory of that day."],
    ["take over", "phr.", "인수하다, 떠맡다", "She will take over the team next month."],
    ["wander", "v.", "거닐다, 헤매다", "We wandered around the old town all afternoon."]
  ];

  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function makeWord(w, pos, m, ex) {
    return { id: uid(), word: w.trim(), pos: pos || "", meaning: m.trim(), example: (ex || "").trim(), box: 0, due: 0, seen: 0, right: 0 };
  }
  function sampleWords() { return SAMPLE.map(function (s) { return makeWord(s[0], s[1], s[2], s[3]); }); }

  var state = load();
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var s = JSON.parse(raw); if (s && Array.isArray(s.words)) return s; }
    } catch (e) {}
    return { words: sampleWords(), lastDay: "", streak: 0 };
  }
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  function todayStr(d) { d = d || new Date(); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  function markStudied() {
    var t = todayStr();
    if (state.lastDay === t) return;
    var y = todayStr(new Date(Date.now() - DAY));
    state.streak = state.lastDay === y ? (state.streak || 0) + 1 : 1;
    state.lastDay = t;
  }
  function currentStreak() {
    if (state.lastDay === todayStr() || state.lastDay === todayStr(new Date(Date.now() - DAY))) return state.streak || 0;
    return 0;
  }

  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function dueWords() { var now = Date.now(); return state.words.filter(function (w) { return w.due <= now && w.box < 5; }); }
  function highlight(example, word) {
    var safe = esc(example);
    var stem = word.split(" ")[0];
    if (stem.length < 3) return safe;
    var root = stem.length > 4 ? stem.slice(0, stem.length - 1) : stem;
    var re = new RegExp("(" + root.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "[a-z]*)", "i");
    return safe.replace(re, "<mark>$1</mark>");
  }

  var toastTimer;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 1800);
  }

  function speak(text) {
    try {
      if (!window.speechSynthesis) { toast("이 브라우저는 발음 듣기를 지원하지 않아요"); return; }
      speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(text); u.lang = "en-US"; u.rate = .9;
      speechSynthesis.speak(u);
    } catch (e) { toast("발음을 재생할 수 없어요"); }
  }

  function renderStats() {
    $("st-total").textContent = state.words.length;
    $("st-due").textContent = dueWords().length;
    $("st-master").textContent = state.words.filter(function (w) { return w.box >= 5; }).length;
    $("st-streak").textContent = currentStreak();
  }

  /* ---------- Tabs ---------- */
  var views = ["cards", "quiz", "list"];
  function show(view) {
    if (views.indexOf(view) < 0) view = "cards";
    views.forEach(function (v) {
      $("view-" + v).hidden = v !== view;
      $("tab-" + v).setAttribute("aria-selected", v === view ? "true" : "false");
    });
    if (view === "cards") startCards();
    if (view === "quiz") startQuiz();
    if (view === "list") renderList();
    try { sessionStorage.setItem(KEY + "-tab", view); } catch (e) {}
  }
  document.querySelectorAll("nav.tabs button").forEach(function (b) {
    b.addEventListener("click", function () { show(b.dataset.view); });
  });

  /* ---------- Flashcards ---------- */
  var deck = [], deckIdx = 0, deckMode = "due", sessionDone = 0;
  function startCards(mode) {
    deckMode = mode || "due";
    deck = shuffle(deckMode === "due" ? dueWords() : state.words);
    deckIdx = 0; sessionDone = 0;
    renderCard();
  }
  function renderCard() {
    var body = $("cards-body");
    renderStats();
    if (!state.words.length) {
      body.innerHTML = '<div class="empty"><h2>단어가 없어요</h2><p class="muted">단어 목록 탭에서 외울 단어를 추가해 보세요.</p><button class="btn primary" id="go-list">단어 추가하러 가기</button></div>';
      $("go-list").onclick = function () { show("list"); };
      return;
    }
    if (deckIdx >= deck.length) {
      var msg = deck.length ? sessionDone + "개 카드를 복습했어요." : "오늘 복습할 카드를 모두 끝냈어요.";
      body.innerHTML = '<div class="empty"><h2>' + (deck.length ? "한 바퀴 완료" : "오늘 복습 끝") + '</h2><p class="muted">' + msg + ' 내일 다시 오면 복습할 카드가 준비돼 있어요.</p><div class="row" style="justify-content:center"><button class="btn primary" id="again-all">전체 단어 연습하기</button><button class="btn" id="go-quiz">퀴즈 풀기</button></div></div>';
      $("again-all").onclick = function () { startCards("all"); };
      $("go-quiz").onclick = function () { show("quiz"); };
      return;
    }
    var w = deck[deckIdx];
    var boxes = ""; for (var i = 1; i <= 5; i++) boxes += '<i class="' + (w.box >= i ? "on" : "") + '"></i>';
    body.innerHTML =
      '<div class="row spread" style="margin-bottom:12px"><span class="mono muted">' + (deckMode === "due" ? "오늘 복습" : "전체 연습") + ' · ' + (deckIdx + 1) + ' / ' + deck.length + '</span>' +
      '<button class="btn small" id="speak">발음 듣기</button></div>' +
      '<div class="card-stage"><button class="card" id="card" aria-label="카드 뒤집기">' +
        '<div class="face front"><div class="top"><span class="mono">' + esc(w.pos || "word") + '</span><span class="boxes" title="암기 단계 ' + w.box + '/5">' + boxes + '</span></div>' +
          '<div class="word">' + esc(w.word) + '</div><div class="hint">탭하거나 스페이스바를 눌러 뜻 보기</div></div>' +
        '<div class="face back"><div class="top"><span class="mono">' + esc(w.word) + '</span><span class="mono">' + esc(w.pos) + '</span></div>' +
          '<div class="meaning">' + esc(w.meaning) + '</div>' +
          (w.example ? '<p class="example">' + highlight(w.example, w.word) + '</p>' : '') +
          '<div class="hint">외웠으면 ‘알아요’, 헷갈리면 ‘다시’</div></div>' +
      '</button></div>' +
      '<div class="row" style="margin-top:16px;justify-content:center">' +
        '<button class="btn bad" id="k-no">다시 <span class="mono">(1)</span></button>' +
        '<button class="btn good" id="k-yes">알아요 <span class="mono">(2)</span></button>' +
      '</div>';
    var card = $("card");
    var fit = function () {
      var f = card.querySelector(".front"), b = card.querySelector(".back");
      card.style.minHeight = Math.max(280, f.scrollHeight, b.scrollHeight) + "px";
    };
    fit();
    card.onclick = function () { card.classList.toggle("flipped"); };
    $("speak").onclick = function () { speak(w.word); };
    $("k-no").onclick = function () { grade(false); };
    $("k-yes").onclick = function () { grade(true); };
  }
  function grade(known) {
    var w = deck[deckIdx]; if (!w) return;
    w.seen++;
    if (known) { w.right++; w.box = Math.min(5, w.box + 1); w.due = Date.now() + INTERVALS[w.box] * DAY; }
    else { w.box = 0; w.due = Date.now(); if (deckMode === "due" || deck.length > 1) deck.push(w); }
    markStudied(); save();
    deckIdx++; sessionDone++;
    renderCard();
  }
  document.addEventListener("keydown", function (e) {
    if ($("view-cards").hidden || /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
    var card = $("card"); if (!card) return;
    if (e.code === "Space") { e.preventDefault(); card.classList.toggle("flipped"); }
    else if (e.key === "1") grade(false);
    else if (e.key === "2") grade(true);
  });

  /* ---------- Quiz ---------- */
  var quizMode = "choice", qList = [], qIdx = 0, qScore = 0, qAnswered = false, QN = 10;
  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      quizMode = b.dataset.mode;
      document.querySelectorAll(".seg button").forEach(function (x) { x.setAttribute("aria-pressed", x === b ? "true" : "false"); });
      startQuiz();
    });
  });
  function startQuiz() {
    // Prefer words that are weaker (lower box) so the quiz targets what you don't know yet
    var pool = shuffle(state.words).sort(function (a, b) { return a.box - b.box; });
    qList = shuffle(pool.slice(0, Math.min(QN, pool.length)));
    qIdx = 0; qScore = 0; renderQuiz();
  }
  function renderQuiz() {
    var body = $("quiz-body");
    $("quiz-score").textContent = qScore + " / " + qIdx;
    renderStats();
    if (state.words.length < 4) {
      body.innerHTML = '<div class="empty"><h2>단어가 더 필요해요</h2><p class="muted">퀴즈는 단어가 4개 이상일 때 시작할 수 있어요.</p><button class="btn primary" id="q-go-list">단어 추가하기</button></div>';
      $("q-go-list").onclick = function () { show("list"); };
      return;
    }
    if (qIdx >= qList.length) {
      var pct = Math.round(qScore / qList.length * 100);
      body.innerHTML = '<div class="empty"><h2>' + qScore + ' / ' + qList.length + ' 정답</h2><p class="muted">정답률 ' + pct + '%. ' +
        (pct >= 80 ? "아주 잘했어요." : pct >= 50 ? "조금만 더 하면 돼요." : "틀린 단어는 카드에서 다시 복습해 보세요.") +
        '</p><div class="row" style="justify-content:center"><button class="btn primary" id="q-again">다시 풀기</button><button class="btn" id="q-cards">카드 복습</button></div></div>';
      $("q-again").onclick = startQuiz;
      $("q-cards").onclick = function () { show("cards"); };
      return;
    }
    qAnswered = false;
    var w = qList[qIdx];
    var prog = '<div class="progress" style="margin-bottom:14px"><div style="width:' + (qIdx / qList.length * 100) + '%"></div></div>';
    if (quizMode === "choice") {
      var others = shuffle(state.words.filter(function (x) { return x.id !== w.id && x.meaning !== w.meaning; })).slice(0, 3);
      var opts = shuffle(others.concat([w]));
      body.innerHTML = prog +
        '<div class="quiz-q"><span class="mono muted">' + (qIdx + 1) + '번 · 알맞은 뜻을 고르세요</span>' +
        '<div class="row spread"><div class="word" style="margin:0">' + esc(w.word) + '</div><button class="btn small" id="q-speak">발음 듣기</button></div></div>' +
        '<div class="choices" style="margin-top:12px">' + opts.map(function (o, i) {
          return '<button class="choice" data-id="' + o.id + '"><span class="mono muted">' + (i + 1) + '</span>&nbsp; ' + esc(o.meaning) + '</button>';
        }).join("") + '</div>' +
        '<p class="feedback" id="q-fb"></p><div class="row" id="q-next-row" hidden><button class="btn primary" id="q-next">다음 문제</button></div>';
      $("q-speak").onclick = function () { speak(w.word); };
      body.querySelectorAll(".choice").forEach(function (btn) {
        btn.onclick = function () { answerChoice(btn, w); };
      });
    } else {
      body.innerHTML = prog +
        '<div class="quiz-q"><span class="mono muted">' + (qIdx + 1) + '번 · 뜻을 보고 영어 철자를 쓰세요</span>' +
        '<div class="meaning" style="margin:0">' + esc(w.meaning) + ' <span class="pos">' + esc(w.pos) + '</span></div>' +
        '<span class="muted" style="font-size:13px">힌트: ' + esc(w.word.charAt(0)) + ' 로 시작, ' + w.word.length + '글자</span></div>' +
        '<form class="type-in" id="q-form" style="margin-top:12px"><input id="q-input" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="영어 단어 입력"><button class="btn primary" type="submit">확인</button></form>' +
        '<p class="feedback" id="q-fb"></p><div class="row" id="q-next-row" hidden><button class="btn primary" id="q-next">다음 문제</button><button class="btn small" id="q-speak">발음 듣기</button></div>';
      var inp = $("q-input"); try { inp.focus({ preventScroll: true }); } catch (e) {}
      $("q-form").onsubmit = function (e) {
        e.preventDefault(); if (qAnswered) { next(); return; }
        var ok = inp.value.trim().toLowerCase() === w.word.toLowerCase();
        finish(ok, w, ok ? "정답이에요!" : "정답은 " + w.word + " 입니다.");
        inp.readOnly = true;
      };
      $("q-speak").onclick = function () { speak(w.word); };
    }
    $("q-next").onclick = next;
  }
  function answerChoice(btn, w) {
    if (qAnswered) return;
    var ok = btn.dataset.id === w.id;
    $("quiz-body").querySelectorAll(".choice").forEach(function (b) {
      if (b.dataset.id === w.id) b.classList.add("right"); else if (b === btn) b.classList.add("wrong");
    });
    finish(ok, w, ok ? "정답이에요!" : "정답은 ‘" + w.meaning + "’ 입니다.");
  }
  function finish(ok, w, msg) {
    qAnswered = true;
    if (ok) { qScore++; w.right++; } else { w.box = 0; w.due = Date.now(); }
    w.seen++; markStudied(); save();
    var fb = $("q-fb"); fb.textContent = msg; fb.className = "feedback " + (ok ? "ok" : "no");
    $("q-next-row").hidden = false;
    $("quiz-score").textContent = qScore + " / " + (qIdx + 1);
    try { $("q-next").focus({ preventScroll: true }); } catch (e) {}
    renderStats();
  }
  function next() { qIdx++; renderQuiz(); }
  document.addEventListener("keydown", function (e) {
    if ($("view-quiz").hidden || quizMode !== "choice" || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
    var n = parseInt(e.key, 10);
    var btns = $("quiz-body").querySelectorAll(".choice");
    if (n >= 1 && n <= btns.length && !qAnswered) btns[n - 1].click();
  });

  /* ---------- List ---------- */
  function renderList() {
    renderStats();
    var q = $("search").value.trim().toLowerCase();
    var list = state.words.filter(function (w) {
      return !q || w.word.toLowerCase().indexOf(q) >= 0 || w.meaning.toLowerCase().indexOf(q) >= 0;
    }).sort(function (a, b) { return a.word.localeCompare(b.word); });
    var ul = $("word-list");
    if (!list.length) {
      ul.innerHTML = '<li style="display:block" class="muted">' + (q ? "검색 결과가 없어요." : "아직 단어가 없어요. 위에서 추가해 보세요.") + '</li>';
      return;
    }
    ul.innerHTML = list.map(function (w) {
      return '<li><div class="w">' + esc(w.word) + ' <span class="pos">' + esc(w.pos) + '</span></div>' +
        '<div class="act"><span class="mono muted" title="암기 단계">' + (w.box >= 5 ? "완료" : w.box + "/5") + '</span>' +
        '<button class="icon-btn" data-speak="' + w.id + '">발음</button>' +
        '<button class="icon-btn" data-del="' + w.id + '">삭제</button></div>' +
        '<div class="m">' + esc(w.meaning) + '</div></li>';
    }).join("");
  }
  $("search").addEventListener("input", renderList);
  $("word-list").addEventListener("click", function (e) {
    var t = e.target.closest("button"); if (!t) return;
    var id = t.dataset.del || t.dataset.speak;
    var w = state.words.find(function (x) { return x.id === id; }); if (!w) return;
    if (t.dataset.speak) { speak(w.word); return; }
    state.words = state.words.filter(function (x) { return x.id !== id; });
    save(); renderList(); toast("‘" + w.word + "’ 삭제했어요");
  });
  function exists(word) { word = word.toLowerCase(); return state.words.some(function (w) { return w.word.toLowerCase() === word; }); }
  $("add-form").addEventListener("submit", function (e) {
    e.preventDefault();
    var word = $("f-word").value.trim(), meaning = $("f-meaning").value.trim();
    if (!word || !meaning) return;
    if (exists(word)) { toast("이미 있는 단어예요"); return; }
    state.words.push(makeWord(word, $("f-pos").value, meaning, $("f-example").value));
    save(); e.target.reset(); $("f-word").focus(); renderList(); toast("‘" + word + "’ 추가했어요");
  });
  $("bulk-add").addEventListener("click", function () {
    var n = 0, skip = 0;
    $("f-bulk").value.split(/\n/).forEach(function (line) {
      var m = line.match(/^\s*(.+?)\s*(?:,|\t|\s-\s|:)\s*(.+?)\s*$/);
      if (!m) { if (line.trim()) skip++; return; }
      if (exists(m[1])) { skip++; return; }
      state.words.push(makeWord(m[1], "", m[2], "")); n++;
    });
    save(); renderList();
    if (n) $("f-bulk").value = "";
    toast(n + "개 추가" + (skip ? ", " + skip + "개 건너뜀" : "") + "했어요");
  });

  // Two-step confirm built into the page (dialogs are unavailable in some viewers)
  var pending = null, pendingTimer;
  function confirmStep(btn, label, action) {
    if (pending === btn) { clearTimeout(pendingTimer); pending = null; btn.textContent = label; action(); return; }
    if (pending) pending.textContent = pending.dataset.label;
    pending = btn; btn.dataset.label = label; btn.textContent = "한 번 더 누르면 실행";
    pendingTimer = setTimeout(function () { if (pending === btn) { btn.textContent = label; pending = null; } }, 3000);
  }
  $("reset-progress").addEventListener("click", function () {
    confirmStep(this, "학습 기록 초기화", function () {
      state.words.forEach(function (w) { w.box = 0; w.due = 0; w.seen = 0; w.right = 0; });
      state.streak = 0; state.lastDay = ""; save(); renderList(); toast("학습 기록을 초기화했어요");
    });
  });
  $("restore-sample").addEventListener("click", function () {
    var n = 0;
    sampleWords().forEach(function (w) { if (!exists(w.word)) { state.words.push(w); n++; } });
    save(); renderList(); toast(n ? n + "개 예시 단어를 넣었어요" : "예시 단어가 이미 모두 있어요");
  });
  $("clear-all").addEventListener("click", function () {
    confirmStep(this, "모든 단어 삭제", function () { state.words = []; save(); renderList(); toast("모든 단어를 삭제했어요"); });
  });

  var startTab = "cards";
  try { startTab = sessionStorage.getItem(KEY + "-tab") || "cards"; } catch (e) {}
  show(startTab);
})();
</script>
