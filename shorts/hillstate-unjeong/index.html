<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/js/gsap.min.js"></script>
    <style>
      
@font-face { font-family: 'Pretendard'; src: url('assets/fonts/Pretendard-Regular.woff2') format('woff2'); font-weight: 400; }
@font-face { font-family: 'Pretendard'; src: url('assets/fonts/Pretendard-SemiBold.woff2') format('woff2'); font-weight: 600; }
@font-face { font-family: 'Pretendard'; src: url('assets/fonts/Pretendard-Bold.woff2') format('woff2'); font-weight: 700; }
@font-face { font-family: 'Pretendard'; src: url('assets/fonts/Pretendard-ExtraBold.woff2') format('woff2'); font-weight: 800; }

      :root { 
  --bg: #0c1519; --panel: #13232a; --panel2: #1a2f37; --line: #27424c;
  --ink: #f3f1ea; --muted: #93a7ad; --hill: #3fd0b0; --hill-soft: rgba(63,208,176,.16);
  --gold: #f2c14e; --pru: #8fa8ff; --ipk: #ff8f6b; --down: #6fb6ff;
 }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--bg); }
      #root { width: 100%; height: 100%; position: relative; font-family: 'Pretendard', sans-serif; }
      #bg { position: absolute; inset: 0; z-index: 0; background:
              radial-gradient(900px 700px at 15% 12%, rgba(63,208,176,.20), transparent 70%),
              radial-gradient(800px 800px at 90% 80%, rgba(242,193,78,.10), transparent 70%), var(--bg); }
      #grid { position: absolute; inset: -80px; z-index: 1; opacity: .35;
              background-image: linear-gradient(rgba(255,255,255,.05) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.05) 2px, transparent 2px);
              background-size: 80px 80px; }
      #foot { position: absolute; left: 0; right: 0; top: 1360px; z-index: 1; text-align: center; font-size: 28px; color: rgba(147,167,173,.55); font-weight: 600; letter-spacing: .3em; }
      #logo { position: absolute; right: 36px; top: 178px; width: 170px; height: auto; z-index: 6; border-radius: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.45); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="42.0" data-width="1080" data-height="1920">
      <div id="bg"></div>
      <div id="grid"></div>
      <div id="foot" data-layout-ignore>HILLSTATE · UNJEONG</div>
      <img id="logo" src="assets/images/logo.png" alt="현대베스트부동산 031-949-6649" />
      <div id="s1" data-composition-id="s1" data-composition-src="compositions/s1.html" data-start="0.0" data-duration="5.45" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="s2" data-composition-id="s2" data-composition-src="compositions/s2.html" data-start="5.45" data-duration="8.4" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="s3" data-composition-id="s3" data-composition-src="compositions/s3.html" data-start="13.85" data-duration="7.6" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="s4" data-composition-id="s4" data-composition-src="compositions/s4.html" data-start="21.45" data-duration="8.0" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="s5" data-composition-id="s5" data-composition-src="compositions/s5.html" data-start="29.45" data-duration="4.45" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="s6" data-composition-id="s6" data-composition-src="compositions/s6.html" data-start="33.9" data-duration="8.1" data-track-index="1" data-track-kind="graphics" data-width="1080" data-height="1920" style="z-index:2"></div>
      <div id="caps" data-composition-id="caps" data-composition-src="compositions/caps.html" data-start="0" data-duration="42.0" data-track-index="2" data-track-kind="captions" data-width="1080" data-height="1920" style="z-index:5"></div>
      <audio id="mix" src="assets/audio/mix.wav" data-start="0" data-duration="42.0" data-track-index="3"></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.to('#logo', { opacity: 0, duration: 0.3 }, 33.75);
      tl.fromTo('#grid', { x: 0, y: 0 }, { x: -80, y: -80, duration: 42.0, ease: 'none' }, 0);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
